name: Daily Competitor Brief

# Schedule: ogni giorno alle 7:00 UTC (modifica per il tuo fuso orario se serve)
# Nota: GitHub Actions cron usa UTC. 7:00 UTC = 8:00 CET / 9:00 CEST.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:  # permette di lanciare il workflow manualmente dalla dashboard

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run team_agenti.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT }}
        run: python team_agenti.py

      - name: Commit brief generato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs/*.md
          git diff --quiet --staged || git commit -m "daily brief $(date +%Y-%m-%d)"
          git push
