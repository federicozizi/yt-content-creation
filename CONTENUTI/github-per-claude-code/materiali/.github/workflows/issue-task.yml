name: Claude — processa issue con label "claude-task"

# Trigger: quando viene aggiunta la label "claude-task" a una issue
on:
  issues:
    types: [labeled]

jobs:
  task:
    if: github.event.label.name == 'claude-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude on the issue body
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PROMPT="Hai una nuova task dall'issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          Descrizione:
          ${ISSUE_BODY}

          Implementa la modifica nel repo. Se serve, modifica i file e proponi una PR.
          Branch: auto/issue-${ISSUE_NUMBER}.
          Quando finisci, commenta l'issue con un riassunto di cosa hai fatto."

          claude --print --permission-mode acceptEdits "$PROMPT"

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/issue-${{ github.event.issue.number }}
          commit-message: "fix: issue #${{ github.event.issue.number }}"
          title: "🤖 Claude — issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            PR generata da Claude Code in risposta all'issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          delete-branch: true
