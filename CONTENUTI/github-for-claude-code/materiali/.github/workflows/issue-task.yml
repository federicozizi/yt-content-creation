name: Claude — process issues with "claude-task" label

# Trigger: when the "claude-task" label is added to an issue
on:
  issues:
    types: [labeled]

jobs:
  task:
    if: github.event.label.name == 'claude-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude on the issue body
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PROMPT="You have a new task from issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          Description:
          ${ISSUE_BODY}

          Implement the change in the repo. If needed, modify files and propose a PR.
          Branch: auto/issue-${ISSUE_NUMBER}.
          When done, comment on the issue with a summary of what you did."

          claude --print --permission-mode acceptEdits "$PROMPT"

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/issue-${{ github.event.issue.number }}
          commit-message: "fix: issue #${{ github.event.issue.number }}"
          title: "🤖 Claude — issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            PR generated by Claude Code in response to issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          delete-branch: true
