<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive 3D Globe</title>
<style>
  :root {
    --panel-bg: rgba(8, 14, 28, 0.92);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e5e7eb;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --accent: #4ade80;
    --accent-glow: rgba(74, 222, 128, 0.4);
    --card-bg: rgba(255, 255, 255, 0.04);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
  }
  canvas { display: block; }
  canvas.clickable { cursor: pointer; }

  #info {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 12px 16px;
    background: rgba(8, 12, 24, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    max-width: 280px;
    z-index: 5;
  }
  #info strong {
    color: #fff;
    font-size: 14px;
    display: block;
    margin-bottom: 4px;
  }
  #info kbd {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px;
    font-family: ui-monospace, monospace;
  }
  #info .tip {
    margin-top: 6px;
    color: #4ade80;
    font-size: 12px;
  }
  #loader {
    position: absolute;
    bottom: 16px;
    left: 16px;
    padding: 6px 12px;
    background: rgba(8, 12, 24, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    font-size: 12px;
    color: #94a3b8;
    transition: opacity 0.4s ease;
    z-index: 5;
  }
  #loader.done { opacity: 0.45; }

  /* hover tooltip */
  .tooltip {
    position: fixed;
    background: rgba(8, 14, 28, 0.95);
    border: 1px solid var(--panel-border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -150%);
    transition: opacity 0.15s ease;
    white-space: nowrap;
    backdrop-filter: blur(10px);
    z-index: 100;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .flag-mini { margin-right: 6px; }

  /* scrim behind the panel */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 10;
  }
  .scrim.visible { opacity: 1; pointer-events: auto; }

  /* side panel */
  .panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(440px, 92vw);
    background: var(--panel-bg);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-left: 1px solid var(--panel-border);
    box-shadow: -24px 0 80px rgba(0, 0, 0, 0.7), -4px 0 20px rgba(0, 0, 0, 0.4);
    transform: translateX(105%);
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 20;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }
  .panel.open { transform: translateX(0); }

  .panel-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, color 0.2s ease, transform 0.3s ease;
    z-index: 2;
  }
  .panel-close:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    transform: rotate(90deg);
  }

  .panel-inner {
    padding: 48px 32px 32px;
    overflow-y: auto;
    flex: 1;
  }
  /* staggered fade-in of content */
  .panel-inner > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .panel.open .panel-inner > * { opacity: 1; transform: translateY(0); }
  .panel.open .panel-inner > *:nth-child(1) { transition-delay: 0.18s; }
  .panel.open .panel-inner > *:nth-child(2) { transition-delay: 0.24s; }
  .panel.open .panel-inner > *:nth-child(3) { transition-delay: 0.30s; }
  .panel.open .panel-inner > *:nth-child(4) { transition-delay: 0.36s; }
  .panel.open .panel-inner > *:nth-child(5) { transition-delay: 0.42s; }

  .panel-header { margin-bottom: 28px; }
  .panel-flag {
    font-size: 4.5rem;
    line-height: 1;
    margin-bottom: 14px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
  }
  .panel-title {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .panel-subtitle {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin: 0;
  }
  .panel-meta {
    color: var(--text-dim);
    font-size: 0.9rem;
    display: flex; gap: 10px; align-items: center;
    margin-top: 6px;
  }
  .panel-meta .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-muted);
  }
  .accent-bar {
    width: 48px; height: 3px; border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
    margin-top: 18px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 500;
  }
  .stat-value {
    font-size: 1.02rem;
    color: #fff;
    font-weight: 600;
  }
  .stat-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 400;
  }

  .section-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    font-weight: 600;
    margin: 0 0 12px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.94rem;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .info-label { color: var(--text-dim); }
  .info-row .info-value { color: #fff; font-weight: 500; }

  .iso-badge {
    display: inline-block;
    padding: 2px 8px;
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.3);
    color: var(--accent);
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
  }

  /* panel scrollbar */
  .panel-inner::-webkit-scrollbar { width: 6px; }
  .panel-inner::-webkit-scrollbar-track { background: transparent; }
  .panel-inner::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  .panel-inner::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

  @media (max-width: 600px) {
    .panel { width: 100vw; }
    .panel-inner { padding: 56px 22px 24px; }
    .panel-flag { font-size: 3.5rem; }
    .panel-title { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div id="info">
  <strong>Interactive 3D Globe</strong>
  <kbd>Drag</kbd> rotate &middot;
  <kbd>Scroll</kbd> zoom &middot;
  <kbd>Right-click</kbd> pan
  <div class="tip">Click a country to open its card</div>
</div>

<div id="loader">Loading country borders...</div>

<div class="tooltip" id="tooltip"></div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="panel-close" id="panel-close" aria-label="Close panel">✕</button>
  <div class="panel-inner" id="panel-inner"></div>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Scene, camera, renderer ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.FogExp2(0x02040a, 0.015);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(0, 0.4, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const canvasEl = renderer.domElement;

/* ---------- Starfield ---------- */
function buildStars(count, radius) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const palette = [
    [1.0, 1.0, 1.0], [0.85, 0.9, 1.0],
    [1.0, 0.95, 0.85], [0.75, 0.85, 1.0],
  ];
  for (let i = 0; i < count; i++) {
    const r = radius * (0.6 + Math.random() * 0.4);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3 + 2] = r * Math.cos(phi);
    const c = palette[(Math.random() * palette.length) | 0];
    const k = 0.5 + Math.random() * 0.5;
    col[i*3]     = c[0] * k;
    col[i*3 + 1] = c[1] * k;
    col[i*3 + 2] = c[2] * k;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.7, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}
const stars = buildStars(6000, 400);
scene.add(stars);

/* ---------- Earth ---------- */
const earthGroup = new THREE.Group();
earthGroup.rotation.z = -23.5 * Math.PI / 180;
scene.add(earthGroup);

const EARTH_RADIUS = 1;

const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 96, 96),
  new THREE.MeshPhongMaterial({
    color: 0x0b2545,
    emissive: 0x05122a,
    emissiveIntensity: 0.4,
    shininess: 14,
    specular: 0x1e3a5f,
  })
);
earthGroup.add(earthMesh);

const haloMat = new THREE.ShaderMaterial({
  uniforms: { c: { value: 0.6 }, p: { value: 4.0 } },
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float c;
    uniform float p;
    varying vec3 vNormal;
    void main() {
      float intensity = pow(c - dot(vNormal, vec3(0.0, 0.0, 1.0)), p);
      gl_FragColor = vec4(0.35, 0.6, 1.0, 1.0) * intensity;
    }
  `,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
});
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.18, 64, 64),
  haloMat
));

/* ---------- Lights ---------- */
scene.add(new THREE.AmbientLight(0x6688aa, 0.35));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(5, 2, 4);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4488ff, 0.35);
rim.position.set(-4, -1, -3);
scene.add(rim);

/* ---------- Coordinate helper ---------- */
function lonLatToVec3(lon, lat, r = EARTH_RADIUS) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ---------- Fetch ---------- */
const GEOJSON_URLS = [
  'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson',
  'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson',
];

async function fetchGeoJSON() {
  for (const url of GEOJSON_URLS) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (_) { /* try next */ }
  }
  throw new Error('Could not load GeoJSON');
}

async function fetchCountryData() {
  // Try the extended dataset first (197 countries), then the base one
  for (const path of ['./countries-data.json', './countries.json']) {
    try {
      const res = await fetch(path);
      if (!res.ok) continue;
      const data = await res.json();
      // Normalize: countries-data.json uses "countries", countries.json also uses "countries"
      const list = data.countries || data.paesi || [];
      return list.map(normalizeCountry);
    } catch (_) { /* try next */ }
  }
  return [];
}

function normalizeCountry(c) {
  // Accepts both the EN and legacy IT shapes
  return {
    iso: (c.iso_code || c.codice_iso || c.id || '').toUpperCase(),
    name: c.name || c.nome_en || c.nome,
    name_local: c.name_local || c.nome || c.name,
    capital: c.capital || c.capitale,
    population: c.population ?? c.popolazione,
    gdp_billion_usd: c.gdp_billion_usd ?? c.pil_miliardi_usd ?? null,
    gdp_str: c.gdp || null,
    continent: c.continent || c.continente,
    flag: c.flag || c.bandiera || '🏳️',
  };
}

/* ---------- Build country meshes (with ISO tagging) ---------- */
// For each geojson feature we tag the meshes with the country ISO,
// so we can highlight them on hover and identify them on click.
const fillBase     = new THREE.MeshBasicMaterial({ color: 0x14532d, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false });
const fillHover    = new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false });
const borderBase   = new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.55 });
const borderHover  = new THREE.LineBasicMaterial({ color: 0xa7f3d0, transparent: true, opacity: 1.0 });

const fillMeshes   = [];           // all raycastable meshes
const meshesByIso  = new Map();    // iso → { fills: [...], borders: [...] }

function meshGroupFor(iso) {
  if (!meshesByIso.has(iso)) meshesByIso.set(iso, { fills: [], borders: [] });
  return meshesByIso.get(iso);
}

function buildBorders(geojson) {
  const r = EARTH_RADIUS * 1.002;

  for (const feat of geojson.features) {
    const geom = feat.geometry;
    if (!geom) continue;

    const props = feat.properties || {};
    // Natural Earth: ISO_A2_EH is more reliable (e.g., France ISO_A2="-99" but ISO_A2_EH="FR")
    let iso = (props.ISO_A2_EH || props.ISO_A2 || props.WB_A2 || '').toUpperCase();
    if (!iso || iso === '-99') iso = (props.ADM0_A3 || props.ADMIN || '').slice(0, 2).toUpperCase();
    const featureMeta = { iso, name: props.ADMIN || props.NAME || 'Unknown' };

    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    const group = meshGroupFor(iso);

    for (const poly of polys) {
      // borders
      for (const ring of poly) {
        if (ring.length < 2) continue;
        const pts = ring.map(([lon, lat]) => lonLatToVec3(lon, lat, r));
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(lineGeo, borderBase);
        line.userData = featureMeta;
        earthGroup.add(line);
        group.borders.push(line);
      }

      // fill (triangle fan from approximate centroid)
      if (poly[0] && poly[0].length >= 3) {
        try {
          const fillPts = poly[0].map(([lon, lat]) => lonLatToVec3(lon, lat, r * 0.999));
          const fillGeo = new THREE.BufferGeometry();
          const verts = [];
          const center = new THREE.Vector3();
          fillPts.forEach(p => center.add(p));
          center.divideScalar(fillPts.length).normalize().multiplyScalar(r * 0.999);
          for (let i = 0; i < fillPts.length - 1; i++) {
            verts.push(center.x, center.y, center.z);
            verts.push(fillPts[i].x, fillPts[i].y, fillPts[i].z);
            verts.push(fillPts[i+1].x, fillPts[i+1].y, fillPts[i+1].z);
          }
          fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
          fillGeo.computeVertexNormals();
          const mesh = new THREE.Mesh(fillGeo, fillBase);
          mesh.userData = featureMeta;
          earthGroup.add(mesh);
          group.fills.push(mesh);
          fillMeshes.push(mesh);
        } catch (_) { /* degenerate poly */ }
      }
    }
  }
}

/* ---------- Loading orchestration ---------- */
const loaderEl = document.getElementById('loader');
let countryDataByIso = new Map();

Promise.all([fetchGeoJSON(), fetchCountryData()])
  .then(([geo, list]) => {
    buildBorders(geo);
    list.forEach(c => { if (c.iso) countryDataByIso.set(c.iso, c); });

    const withData = [...meshesByIso.keys()].filter(iso => countryDataByIso.has(iso)).length;
    loaderEl.textContent = `${geo.features.length} countries on the globe · ${countryDataByIso.size} with data card`;
    setTimeout(() => loaderEl.classList.add('done'), 1800);
  })
  .catch(err => {
    loaderEl.textContent = 'Loading error (serve via http://, not file://)';
    loaderEl.style.color = '#fca5a5';
    console.error(err);
  });

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.6;
controls.minDistance = 1.25;
controls.maxDistance = 12;
controls.enablePan = true;

/* ---------- Raycaster + hover/click ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');
let hoveredIso = null;
let pointerActive = false;
let pointerDownPos = null;
let pointerMoveDist = 0;

function setPointerFromEvent(e) {
  const rect = canvasEl.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  pointerActive = true;
}

function pickCountry() {
  raycaster.setFromCamera(pointer, camera);
  // raycast against fill meshes (more stable than lines for clicking)
  const hits = raycaster.intersectObjects(fillMeshes, false);
  for (const hit of hits) {
    // filter out the hidden hemisphere
    const worldPos = hit.point.clone();
    const camDir = new THREE.Vector3().subVectors(camera.position, worldPos).normalize();
    const normal = worldPos.clone().normalize();
    if (camDir.dot(normal) > 0.02) {
      return hit.object.userData; // { iso, name }
    }
  }
  return null;
}

function setHover(iso) {
  if (iso === hoveredIso) return;

  // restore the previous one
  if (hoveredIso && meshesByIso.has(hoveredIso)) {
    const g = meshesByIso.get(hoveredIso);
    g.fills.forEach(m => m.material = fillBase);
    g.borders.forEach(b => b.material = borderBase);
  }

  hoveredIso = iso;

  if (iso && meshesByIso.has(iso)) {
    const g = meshesByIso.get(iso);
    g.fills.forEach(m => m.material = fillHover);
    g.borders.forEach(b => b.material = borderHover);
  }
}

canvasEl.addEventListener('pointermove', (e) => {
  setPointerFromEvent(e);
  tooltipEl.style.left = e.clientX + 'px';
  tooltipEl.style.top  = e.clientY + 'px';
  if (pointerDownPos) {
    pointerMoveDist += Math.abs(e.clientX - pointerDownPos.x) + Math.abs(e.clientY - pointerDownPos.y);
  }
});

canvasEl.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerMoveDist = 0;
});

canvasEl.addEventListener('pointerup', (e) => {
  setPointerFromEvent(e);
  const wasDrag = pointerMoveDist > 6;
  pointerDownPos = null;
  if (!wasDrag) {
    const picked = pickCountry();
    if (picked && picked.iso) {
      const data = countryDataByIso.get(picked.iso);
      if (data) openPanel(data);
      else openPanelFallback(picked); // country without data card
    }
  }
});

canvasEl.addEventListener('pointerleave', () => {
  pointerActive = false;
  setHover(null);
  canvasEl.classList.remove('clickable');
  tooltipEl.classList.remove('visible');
});

/* ---------- Side panel ---------- */
const panel       = document.getElementById('panel');
const panelInner  = document.getElementById('panel-inner');
const panelClose  = document.getElementById('panel-close');
const scrim       = document.getElementById('scrim');

let panelOpen = false;
let autoRotateEnabled = true;

function openPanel(country) {
  panelInner.innerHTML = renderPanel(country);
  // re-trigger staggered animations on every open
  void panelInner.offsetWidth;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  scrim.classList.add('visible');
  panelOpen = true;
  autoRotateEnabled = false;
}

function openPanelFallback(meta) {
  panelInner.innerHTML = `
    <div class="panel-header">
      <div class="panel-flag">🏳️</div>
      <h2 class="panel-title">${meta.name}</h2>
      <div class="panel-subtitle">ISO code: <span class="iso-badge">${meta.iso || '—'}</span></div>
      <div class="accent-bar"></div>
    </div>
    <p style="color:var(--text-dim);font-size:.95rem;line-height:1.6;">
      This country doesn't have a detailed data card in the JSON yet.
    </p>
  `;
  void panelInner.offsetWidth;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  scrim.classList.add('visible');
  panelOpen = true;
  autoRotateEnabled = false;
}

function closePanel() {
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  scrim.classList.remove('visible');
  panelOpen = false;
  autoRotateEnabled = true;
}

/* ---------- Formatters ---------- */
function fmtPopulation(n) {
  if (n == null) return '—';
  if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(2) + 'B';
  if (n >= 1_000_000)     return (n / 1_000_000).toFixed(1)   + 'M';
  if (n >= 1_000)         return (n / 1_000).toFixed(0)        + 'K';
  return n.toLocaleString('en-US');
}
function fmtGdp(c) {
  if (c.gdp_str) return c.gdp_str;
  const v = c.gdp_billion_usd;
  if (v == null) return '—';
  if (v >= 1000) return '$' + (v / 1000).toFixed(2) + 'T';
  if (v >= 1)    return '$' + v.toFixed(1) + 'B';
  return '$' + (v * 1000).toFixed(0) + 'M';
}

function renderPanel(c) {
  return `
    <div class="panel-header">
      <div class="panel-flag">${c.flag}</div>
      <h2 class="panel-title">${c.name}</h2>
      <p class="panel-subtitle">${c.name_local && c.name_local !== c.name ? c.name_local + ' · ' : ''}<span class="iso-badge">${c.iso}</span></p>
      <div class="panel-meta">
        <span>${c.continent || '—'}</span>
        <span class="dot"></span>
        <span>Capital: ${c.capital || '—'}</span>
      </div>
      <div class="accent-bar"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Population</div>
        <div class="stat-value">${fmtPopulation(c.population)}</div>
        <div class="stat-sub">${c.population ? c.population.toLocaleString('en-US') : ''}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nominal GDP</div>
        <div class="stat-value">${fmtGdp(c)}</div>
        <div class="stat-sub">2023–2024 estimate</div>
      </div>
    </div>

    <div>
      <h3 class="section-label">Identification</h3>
      <div class="info-row">
        <span class="info-label">Name (English)</span>
        <span class="info-value">${c.name}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Name (local)</span>
        <span class="info-value">${c.name_local || c.name}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Capital</span>
        <span class="info-value">${c.capital || '—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Continent</span>
        <span class="info-value">${c.continent || '—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">ISO code</span>
        <span class="info-value"><span class="iso-badge">${c.iso}</span></span>
      </div>
    </div>
  `;
}

panelClose.addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panelOpen) closePanel(); });

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animation loop ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (autoRotateEnabled) earthGroup.rotation.y += dt * 0.04;
  stars.rotation.y += dt * 0.005;

  // hover detection (skip while panel is open)
  if (pointerActive && !panelOpen) {
    const picked = pickCountry();
    if (picked) {
      setHover(picked.iso);
      canvasEl.classList.add('clickable');
      const data = countryDataByIso.get(picked.iso);
      const label = data ? `${data.flag} ${data.name}` : picked.name;
      tooltipEl.innerHTML = label;
      tooltipEl.classList.add('visible');
    } else {
      setHover(null);
      canvasEl.classList.remove('clickable');
      tooltipEl.classList.remove('visible');
    }
  } else if (panelOpen) {
    setHover(null);
    tooltipEl.classList.remove('visible');
    canvasEl.classList.remove('clickable');
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
