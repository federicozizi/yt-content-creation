name: Daily Competitor Brief

on:
  schedule:
    # 7:05 ora di Roma. GitHub usa UTC: 5:05 UTC = 7:05 CEST (estate) / 6:05 CET (inverno).
    # Per semplicità lascia 05:05 UTC tutto l'anno (in inverno arriva alle 6:05 invece che alle 7:05).
    - cron: "5 5 * * *"
  workflow_dispatch: {}

jobs:
  run-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (per Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run team
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT }}
        run: python team_agenti.py

      - name: Commit briefs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add briefs/ || true
          git diff --staged --quiet || git commit -m "brief: $(date +%Y-%m-%d)"
          git push || true
